<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 找不到頁面 - 旗山與斗南</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons (用於地標圖示) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 引入 Google Fonts (Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            height: 100%;
        }

        /* 滿版背景設定，加入半透明黑色遮罩讓白字更清晰 */
        .error-section {
            /* 這裡使用了一張帶有迷霧或空曠公路感的照片，呼應迷路的感覺 */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://cdn-smiletaiwan.cw.com.tw/article/202210/article-6344cb33dc250.jpg') center/cover no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        /* 404 數字設計，延續首頁標題的風格 */
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            margin-bottom: 0;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
        }

        /* 點綴顏色，與首頁的 山.田 呼應 */
        .error-code .dot {
            color: #d8c16d; 
        }

        /* 提示文字 */
        .error-text {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2rem;
            margin-bottom: 2.5rem;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        /* 回首頁按鈕設計 */
        .btn-back-home {
            background-color: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 50px; /* 圓角按鈕增加親和力 */
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* 微微的毛玻璃效果 */
        }

        .btn-back-home:hover {
            background-color: #ff6600; /* 首頁導覽列 hover 的橘色 */
            border-color: #ff6600;
            color: #fff;
            transform: translateY(-3px); /* 懸停時微微上浮 */
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="error-section px-3">
        <!-- 巨大錯誤碼 -->
        <h1 class="error-code">404</h1>
        
        <!-- 呼應旅遊與地區主題的文案 -->
        <p class="error-text">夜色曾替萬物收攏邊界，星子也曾在沉默裡為旅人標記方向。<br>可是你此刻走到的地方，只剩一片溫柔的空白，像風掠過草原後留下的靜。</p>
        <p style="text-align: center;">該頁面不存在或是已被移除</p>
        
        <!-- 帶有地標 icon 的按鈕 -->
        <!-- 請將 href 裡的 index.html 替換成你實際的首頁檔案名稱 -->
        <a href="index.html" class="btn-back-home">
            <i class="bi bi-geo-alt-fill me-2"></i>返回首頁
        </a>
    </div>

</body>
</html>
