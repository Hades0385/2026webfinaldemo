<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>美食地圖｜山·田 SHANTIAN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{
      --bg:#131312;--bg2:#191917;--bg3:#1e1d1b;
      --text:#d8d3c8;--muted:#6a6760;--line:#252320;
      --qs:#996040;--qs-dim:#c07850;
      --dn:#4d6b38;--dn-dim:#6a9450;
      --nav-h:56px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:.9rem}

    /* ── NAV ── */
    nav.main-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:300;display:flex;align-items:center;padding:0 2.5rem;gap:2rem;background:rgba(19,19,18,.9);border-bottom:1px solid var(--line)}
    .nav-brand{margin-right:auto;font-family:'Noto Serif TC',serif;font-size:.95rem;font-weight:300;letter-spacing:.22em;color:rgba(255,255,255,.38);text-decoration:none}
    nav.main-nav a{font-size:.83rem;letter-spacing:.1em;text-decoration:none;color:rgba(255,255,255,.48);transition:color .25s}
    nav.main-nav a.active{color:#c88050}
    nav.main-nav a:hover{color:var(--text)}

    /* ── LAYOUT ── */
    .page-wrap{display:grid;grid-template-columns:340px 1fr;height:100%;padding-top:var(--nav-h)}

    /* ── SIDEBAR ── */
    .sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:1.6rem 1.8rem 1.1rem;border-bottom:1px solid var(--line);flex-shrink:0}
    .sidebar-eyebrow{font-size:.65rem;letter-spacing:.5em;color:var(--muted);margin-bottom:.25rem}
    .sidebar-title{font-family:'Noto Serif TC',serif;font-size:1.4rem;font-weight:300;letter-spacing:.1em}
    .filter-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
    .ftab{flex:1;padding:.62rem 0;font-size:.7rem;letter-spacing:.22em;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s;font-family:'Noto Sans TC',sans-serif}
    .ftab:hover{color:var(--text)}
    .ftab.active{color:var(--text);border-bottom-color:#c88050}
    .ftab.qs-tab.active{border-bottom-color:var(--qs)}
    .ftab.dn-tab.active{border-bottom-color:var(--dn)}
    .count-badge{font-size:.67rem;letter-spacing:.1em;color:var(--muted);padding:.42rem 1.8rem;border-bottom:1px solid var(--line);flex-shrink:0}
    .count-badge span{color:var(--text)}
    .card-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .card-list::-webkit-scrollbar{width:3px}
    .card-list::-webkit-scrollbar-thumb{background:var(--line)}

    /* ── FOOD CARDS ── */
    .food-card{padding:1rem 1.8rem;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s;display:flex;gap:.85rem;align-items:flex-start}
    .food-card:hover{background:var(--bg3)}
    .food-card.active{background:var(--bg3);border-left:2px solid transparent}
    .food-card.qs-active{border-left-color:var(--qs)}.food-card.dn-active{border-left-color:var(--dn)}
    .card-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:.52rem}
    .card-dot.qs{background:var(--qs)}.card-dot.dn{background:var(--dn)}
    .card-body{flex:1;min-width:0}
    .card-name{font-family:'Noto Serif TC',serif;font-size:.92rem;font-weight:400;letter-spacing:.04em;margin-bottom:.12rem}
    .card-type{font-size:.65rem;letter-spacing:.2em;margin-bottom:.28rem}
    .card-type.qs{color:var(--qs-dim)}.card-type.dn{color:var(--dn-dim)}
    .card-desc{font-size:.76rem;line-height:1.62;color:var(--muted)}
    .card-thumb{width:60px;height:60px;flex-shrink:0;overflow:hidden;border-radius:1px;background:var(--bg3)}
    .card-thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.78)}

    /* ── MAP ── */
    .map-wrap{position:relative;height:100%}
    #map{width:100%;height:100%;background:#e8e4dc}

    /* Map layer toggles */
    .map-controls{position:absolute;bottom:1.4rem;right:1.4rem;z-index:400;display:flex;flex-direction:column;gap:.3rem}
    .mc-btn{padding:.44rem 1rem;background:rgba(25,25,23,.85);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--muted);font-size:.68rem;letter-spacing:.2em;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:color .2s,border-color .2s}
    .mc-btn.active{color:var(--text);border-color:rgba(255,255,255,.18)}
    .mc-btn.qs-btn.active{border-color:var(--qs);color:var(--qs-dim)}
    .mc-btn.dn-btn.active{border-color:var(--dn);color:var(--dn-dim)}

    /* ── RICH POPUP ── */
    .leaflet-popup-content-wrapper{
      background:var(--bg2);
      border:1px solid var(--line);
      border-radius:2px;
      box-shadow:0 8px 36px rgba(0,0,0,.55);
      color:var(--text);
      font-family:'Noto Sans TC',sans-serif;
      padding:0;
      overflow:hidden;
    }
    .leaflet-popup-tip-container{margin-top:-1px}
    .leaflet-popup-tip{background:var(--bg2)}
    .leaflet-popup-content{margin:0;width:300px!important}
    .leaflet-popup-close-button{
      color:rgba(255,255,255,.5)!important;
      font-size:1.1rem!important;
      top:6px!important;right:10px!important;
      z-index:10;text-shadow:0 1px 4px rgba(0,0,0,.6);
    }

    /* popup inner layout */
    .rp-img{
      width:100%;height:170px;overflow:hidden;position:relative;background:var(--bg3);
      flex-shrink:0;
    }
    .rp-img img{width:100%;height:100%;object-fit:cover;filter:saturate(.65) brightness(.82);display:block;transition:transform .5s}
    .rp-img:hover img{transform:scale(1.04)}

    /* mini carousel inside popup */
    .rp-img .carousel,.rp-img .carousel-inner,.rp-img .carousel-item{height:100%}
    .rp-img .carousel-item img{width:100%;height:100%;object-fit:cover;filter:saturate(.65) brightness(.82)}
    .rp-indicators{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:5}
    .rp-ind{width:16px;height:1.5px;background:rgba(255,255,255,.35);transition:background .2s;cursor:pointer;border:none;padding:0}
    .rp-ind.active{background:rgba(255,255,255,.8)}

    .rp-body{padding:1rem 1.1rem 1.1rem}
    .rp-region-tag{font-size:.63rem;letter-spacing:.32em;display:flex;align-items:center;gap:.45rem;margin-bottom:.4rem}
    .rp-rdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .rp-rdot.qs{background:var(--qs)}.rp-rdot.dn{background:var(--dn)}
    .rp-region-label.qs{color:var(--qs-dim)}.rp-region-label.dn{color:var(--dn-dim)}
    .rp-name{font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:400;letter-spacing:.04em;margin-bottom:.22rem}
    .rp-type{font-size:.65rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.6rem}
    .rp-desc{font-size:.77rem;line-height:1.75;color:var(--muted);margin-bottom:.7rem}
    .rp-tags{display:flex;flex-wrap:wrap;gap:.28rem}
    .rp-tag{font-size:.62rem;letter-spacing:.12em;padding:.12rem .48rem;border:1px solid var(--line);color:var(--muted)}

    /* ── LEAFLET BASE ── */
    .leaflet-tile-pane{filter:none}
    .leaflet-control-zoom a{background:var(--bg2)!important;color:var(--text)!important;border-color:var(--line)!important}

    /* Marker highlight: custom class added to active marker icon */
    .marker-active svg path { /* can't easily target, use wrapper class */ }

    /* ── RWD ── */
    @media(max-width:860px){
      body{overflow-y:auto}
      .page-wrap{grid-template-columns:1fr;grid-template-rows:50vh 1fr;height:auto}
      .sidebar{max-height:none;order:2}
      .map-wrap{height:50vh;order:1}
      nav.main-nav{padding:0 1.2rem;gap:1rem}
      .nav-brand{display:none}
    }
  </style>
</head>
<body>

<nav class="main-nav">

  <a href="index.html">首頁</a>

</nav>

<div class="page-wrap">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-eyebrow">FOOD MAP · 美食地圖</div>
      <div class="sidebar-title">在地好味道</div>
    </div>
    <div class="filter-tabs">
      <button class="ftab active"  data-filter="all">全部</button>
      <button class="ftab qs-tab"  data-filter="qs" >旗山</button>
      <button class="ftab dn-tab"  data-filter="dn" >斗南</button>
    </div>
    <div class="count-badge">顯示 <span id="countNum">12</span> 個地點</div>
    <div class="card-list" id="cardList"></div>
  </div>

  <!-- Map -->
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-controls">
      <button class="mc-btn qs-btn active" id="btnQs">旗山</button>
      <button class="mc-btn dn-btn active" id="btnDn">斗南</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── DATA ── */
const places = [
  {id:'qs1',region:'qs',name:'旗山老街香蕉冰店',type:'冰品・甜食',lat:22.887551809069794,lng:120.48194988606387,
   desc:'旗山老街最具人氣的香蕉冰店，它以「香蕉清冰」打底的冰品，在地人從小吃到大，同時也提供傳統枝仔冰、冰淇淋等品項， 是老街必嘗的夏日涼品。',tags:['香蕉冰','老街必訪','在地特產'],
   images:[{url:'./img/food/f_qs_sjb_1.jpg',cap:'旗山老街香蕉冰'},{url:'./img/food/f_qs_sjb_2.jpg',cap:'旗山老街風情'}]},
  {id:'qs2',region:'qs',name:'鮮緹香蕉蛋捲',type:'烘焙・伴手禮',lat:22.886367792593614,lng:120.48209914402558,
   desc:'旗山第一家手工現作，每天現作現賣， 使用旗山的北蕉來製作香蕉蛋捲 ，是遊客最愛採買的在地伴手禮。',tags:['香蕉蛋捲','手工烘焙','伴手禮'],
   images:[{url:'./img/food/f_qs_sjdg_1.jpg',cap:'鮮緹香蕉蛋捲'},{url:'./img/food/f_qs_sjdg_2.jpg',cap:'手工烘焙點心'}]},
  {id:'qs3',region:'qs',name:'吳記肉丸',type:'傳統小吃',lat:22.88495306098554,lng:120.48107133422405,
   desc:'在地老字號肉圓，是旗山赫赫有名的「煎肉圓」始祖！在地經營超過50年歷史，至今假日還常常一位難求，是許多人從小吃到大的好味道。',tags:['肉丸','老字號','傳統小吃'],
   images:[{url:'./img/food/f_qs_wj_1.jpg',cap:'吳記肉丸'},{url:'./img/food/f_qs_wj_3.jpg',cap:'旗山老街風情'}]},
  {id:'qs4',region:'qs',name:'旗山第一公有零售市場',type:'傳統市場・早餐',lat:22.889187067656355,lng:120.48192636792456,
   desc:'旗山核心的傳統市場，各種攤販熱情招攬顧客，是旗山最熱鬧的一條街。',tags:['傳統市場','旗山日常','在地早餐'],
   images:[{url:'./img/food/f_qs_sc_1.jpg',cap:'旗山第一公有市場'}]},
  {id:'dn1',region:'dn',name:'文元街陽春麵臭豆腐',type:'麵食・小吃',lat:23.675638616567504,lng:120.4783519783126,
   desc:'文元街陽春麵臭豆腐位於斗南，臭豆腐則外酥內嫩，經過獨特的醃製與炸製，散發出令人難以抗拒的香氣，不帶一絲刺鼻的味道，反而吸引眾多遊客慕名而來。',tags:['陽春麵','臭豆腐','在地日常'],
   images:[{url:'./img/food/f_dn_ycm.jpg',cap:'陽春麵臭豆腐'}]},
  {id:'dn2',region:'dn',name:'斗南炸饅頭',type:'傳統小吃・麵食',lat:23.676786553986332,lng:120.47861675386831,
   desc:'斗南鎮的超人氣深夜排隊美食。其最大特色是營業時間為「夜間至凌晨」，深受夜貓子與學生喜愛。店家將饅頭先炸後烤，再淋上豐富醬料，呈現外酥內軟、甜而不膩的豐富口感。',tags:['炸饅頭','古早味','街頭小食'],
   images:[{url:'https://www.svgrepo.com/show/264669/bread-bun.svg',cap:'陽春麵臭豆腐'}]},
  {id:'dn3',region:'dn',name:'斗南米糕甲',type:'傳統小吃',lat:23.67693219910244,lng:120.47910455251113,
   desc:'雲林斗南70年人氣小吃米糕，上層小塊肉燥搭配金鉤蝦，糯米軟綿、醬香迷人。',tags:['米糕','古早味'],
   images:[{url:'./img/food/f_dn_mg.jpg',cap:'斗南米糕'}]},
  {id:'dn4',region:'dn',name:'斗南圓環鍋貼',type:'鍋貼・餃類',lat:23.675950362441796,lng:120.48035027371742,
   desc:'圓環旁老字號鍋貼攤，鍋貼底部煎至金黃酥脆，現包現煎，內餡以高麗菜豬肉為主。',tags:['鍋貼','圓環','排隊名攤'],
   images:[{url:'./img/food/f_dn_gt.jpg',cap:'斗南圓環鍋貼'}]},
  {id:'dn5',region:'dn',name:'路邊雞蛋糕',type:'甜食・街頭小吃',lat:23.670811125713286,lng:120.47394676252901,
   desc:'在路邊擺攤的雞蛋糕，是在地人在放學時會順路買來吃的點心。',tags:['雞蛋糕','街頭甜點','懷舊小食'],
   images:[{url:'./img/food/f_dn_jdg.jpg',cap:'現烤雞蛋糕'}]},
  {id:'dn6',region:'dn',name:'早一碗豆花 He 來一晚豆花',type:'甜食・豆花',lat:23.67124955758297,lng:120.47809281529427,
   desc:'雲林斗南的熱門手作甜品店。主打口感綿密、古早風味的豆花，搭配軟綿花生等豐富配料，深受在地老饕喜愛。',tags:['豆花','傳統甜點','消暑'],
   images:[{url:'./img/food/f_dn_dh.jpg',cap:'傳統豆花'}]},
  {id:'dn7',region:'dn',name:'清原芋圓 斗南文元總店',type:'飲料・芋圓',lat:23.67584556471403,lng:120.47999016691345,
   desc:'斗南文元總店是台灣知名手搖冰品品牌「清原」的全台創始總店。以九份芋圓、綿密芋泥與燒仙草起家，引領了「手搖飲加芋圓」的台式甜品風潮。',tags:['手搖飲','芋圓','創始店'],
   images:[{url:'./img/food/f_dn_qy.jpg',cap:'芋圓'}]}
];

/* ── MAP ── */
const map = L.map('map', { zoomControl:true, scrollWheelZoom:true, attributionControl:false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(map);

/* Icon factory */
function makeMarkerSVG(color, active) {
  const s = active ? 28 : 20;
  const r = active ? 38 : 28;
  const dot = active ? 5 : 3.5;
  const opacity = active ? 1 : 0.85;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${r}" viewBox="0 0 ${s} ${r}" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,${active?'.6':'.35'}))">
    <path d="M${s/2} 0C${s/2*0.448} 0 0 ${s/2*0.448} 0 ${s/2}c0 ${r*0.536} ${s/2} ${r*0.643} ${s/2} ${r*0.643}S${s} ${s/2+r*0.536} ${s} ${s/2}C${s} ${s/2*0.448} ${s-s/2*0.448} 0 ${s/2} 0z" fill="${color}" opacity="${opacity}"/>
    <circle cx="${s/2}" cy="${s/2}" r="${dot}" fill="rgba(255,255,255,.9)"/>
  </svg>`;
}

function makeIcon(region, active=false) {
  const color = region === 'qs' ? '#996040' : '#4d6b38';
  const svg = makeMarkerSVG(color, active);
  const s = active ? [28,38] : [20,28];
  return L.divIcon({ html:svg, iconSize:s, iconAnchor:[s[0]/2,s[1]], popupAnchor:[0,-s[1]], className:'' });
}

/* Build rich popup HTML */
function buildPopupHTML(p) {
  const imgs = p.images;
  const hasMult = imgs.length > 1;
  const pid = `rpcar-${p.id}`;

  let carouselInner = imgs.map((img, i) =>
    `<div class="carousel-item${i===0?' active':''}">
       <img src="${img.url}" alt="${img.cap}"/>
     </div>`
  ).join('');

  let indicators = hasMult ? imgs.map((_, i) =>
    `<button class="rp-ind${i===0?' active':''}" data-slide="${i}" aria-label="slide ${i+1}"></button>`
  ).join('') : '';

  return `
    <div class="rp-img">
      ${hasMult
        ? `<div id="${pid}" class="carousel slide" data-bs-ride="false" style="height:100%">
             <div class="carousel-inner" style="height:100%">${carouselInner}</div>
             <button class="carousel-control-prev" type="button" data-bs-target="#${pid}" data-bs-slide="prev" style="width:1.8rem"><span class="carousel-control-prev-icon" style="width:.85rem;height:.85rem"></span></button>
             <button class="carousel-control-next" type="button" data-bs-target="#${pid}" data-bs-slide="next" style="width:1.8rem"><span class="carousel-control-next-icon" style="width:.85rem;height:.85rem"></span></button>
             <div class="rp-indicators">${indicators}</div>
           </div>`
        : `<img src="${imgs[0].url}" alt="${imgs[0].cap}"/>`
      }
    </div>
    <div class="rp-body">
      <div class="rp-region-tag">
        <div class="rp-rdot ${p.region}"></div>
        <span class="rp-region-label ${p.region}">${p.region==='qs'?'旗山':'斗南'}</span>
        <span style="color:var(--line);margin:0 .2rem">·</span>
        <span style="font-size:.63rem;letter-spacing:.15em;color:var(--muted)">${p.type}</span>
      </div>
      <div class="rp-name">${p.name}</div>
      <div class="rp-desc">${p.desc}</div>
      <div class="rp-tags">${p.tags.map(t=>`<span class="rp-tag">${t}</span>`).join('')}</div>
    </div>`;
}

/* Markers */
const markerMap = {};
const layerQs = L.layerGroup().addTo(map);
const layerDn = L.layerGroup().addTo(map);
let activeId = null;

places.forEach(p => {
  const layer = p.region === 'qs' ? layerQs : layerDn;
  const m = L.marker([p.lat, p.lng], { icon: makeIcon(p.region) }).addTo(layer);

  m.on('click', () => {
    activateMarker(p.id);
    /* highlight card */
    document.querySelectorAll('.food-card').forEach(c => c.classList.remove('active','qs-active','dn-active'));
    const card = document.querySelector(`.food-card[data-id="${p.id}"]`);
    if (card) { card.classList.add('active',`${p.region}-active`); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  });

  markerMap[p.id] = { marker: m, region: p.region };
});

function activateMarker(id) {
  /* reset previous */
  if (activeId && markerMap[activeId]) {
    const prev = markerMap[activeId];
    prev.marker.setIcon(makeIcon(prev.region, false));
  }
  activeId = id;
  const cur = markerMap[id];
  cur.marker.setIcon(makeIcon(cur.region, true));

  const p = places.find(x => x.id === id);
  cur.marker.bindPopup(buildPopupHTML(p), {
    maxWidth:300, minWidth:300, className:'', autoPan:true, autoPanPaddingTopLeft:L.point(60,80)
  }).openPopup();
}

/* Reset on popup close */
map.on('popupclose', () => {
  if (activeId && markerMap[activeId]) {
    markerMap[activeId].marker.setIcon(makeIcon(markerMap[activeId].region, false));
  }
  activeId = null;
  document.querySelectorAll('.food-card').forEach(c => c.classList.remove('active','qs-active','dn-active'));
});

map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lng])), { padding:[60,60] });

/* ── SIDEBAR CARDS ── */
let activeFilter = 'all';

function renderCards(filter) {
  const filtered = places.filter(p => filter==='all' || p.region===filter);
  document.getElementById('countNum').textContent = filtered.length;
  document.getElementById('cardList').innerHTML = filtered.map(p => `
    <div class="food-card${p.id===activeId?` active ${p.region}-active`:''}" data-id="${p.id}" onclick="flyTo('${p.id}')">
      <div class="card-dot ${p.region}"></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-type ${p.region}">${p.type}</div>
        <div class="card-desc">${p.desc}</div>
      </div>
      <div class="card-thumb"><img src="${p.images[0].url}" alt="${p.name}" loading="lazy"/></div>
    </div>`).join('');
}

function flyTo(id) {
  const p = places.find(x => x.id===id);
  if (!p) return;
  /* ensure layer is visible */
  const layer = p.region==='qs' ? layerQs : layerDn;
  if (!map.hasLayer(layer)) {
    layer.addTo(map);
    document.getElementById(p.region==='qs'?'btnQs':'btnDn').classList.add('active');
  }
  map.flyTo([p.lat, p.lng], 15, { duration:1.0 });
  setTimeout(() => activateMarker(id), 1100);
  renderCards(activeFilter); /* re-render to update active state */
}

/* filter tabs */
document.querySelectorAll('.ftab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards(activeFilter);
    if (activeFilter==='qs') map.flyTo([22.887,120.482],15,{duration:1});
    else if (activeFilter==='dn') map.flyTo([23.675,120.475],15,{duration:1});
    else map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lng])),{padding:[60,60],animate:true});
  });
});

/* layer toggles */
let showQs=true, showDn=true;
document.getElementById('btnQs').addEventListener('click',()=>{
  showQs=!showQs;
  document.getElementById('btnQs').classList.toggle('active',showQs);
  showQs ? layerQs.addTo(map) : layerQs.remove();
});
document.getElementById('btnDn').addEventListener('click',()=>{
  showDn=!showDn;
  document.getElementById('btnDn').classList.toggle('active',showDn);
  showDn ? layerDn.addTo(map) : layerDn.remove();
});

renderCards('all');
</script>
</body>
</html>
